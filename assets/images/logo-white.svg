<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" fill="none">
  <!-- Airplane -->
  <g transform="translate(52,28) rotate(-30)">
    <path d="M0 8 L28 2 Q32 1 32 5 L28 8 L32 14 Q32 17 28 16 L0 10 Z" fill="white"/>
    <path d="M6 8 L14 2 L16 2 L10 8 Z" fill="white"/>
    <path d="M20 13 L26 10 L27 12 L22 14 Z" fill="white"/>
  </g>

  <!-- Road / U-curve path -->
  <path d="M58 130 Q48 80 62 55 Q74 34 95 34 Q116 34 124 55 Q136 80 126 130" stroke="white" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Road center line -->
  <path d="M82 130 Q76 90 83 68 Q89 52 95 50 Q101 52 107 68 Q114 90 108 130" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="6 6"/>

  <!-- Car (side view, simplified Mercedes-style) -->
  <g transform="translate(64, 100)">
    <!-- Body -->
    <path d="M4 18 Q6 8 16 6 L44 5 Q56 5 60 10 L64 18 Z" fill="white"/>
    <!-- Roof -->
    <path d="M18 6 Q22 0 38 0 L52 1 Q58 3 60 6" fill="white"/>
    <!-- Windows -->
    <path d="M20 6 L24 2 L36 2 L40 5 Z" fill="rgba(255,255,255,0.3)"/>
    <path d="M41 5 L44 2 L52 2 L58 5 Z" fill="rgba(255,255,255,0.3)"/>
    <!-- Wheels -->
    <circle cx="14" cy="19" r="6" fill="rgba(255,255,255,0.85)"/>
    <circle cx="14" cy="19" r="2.5" fill="rgba(255,255,255,0.4)"/>
    <circle cx="53" cy="19" r="6" fill="rgba(255,255,255,0.85)"/>
    <circle cx="53" cy="19" r="2.5" fill="rgba(255,255,255,0.4)"/>
    <!-- Bumpers -->
    <rect x="1" y="15" width="5" height="5" rx="1" fill="rgba(255,255,255,0.7)"/>
    <rect x="62" y="15" width="4" height="5" rx="1" fill="rgba(255,255,255,0.7)"/>
    <!-- Star badge -->
    <circle cx="33" cy="1" r="2" fill="rgba(255,255,255,0.6)"/>
  </g>

  <!-- "mbrella" text -->
  <text x="128" y="102" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="72" fill="white" letter-spacing="-2">mbrella</text>

  <!-- "Tours &amp; Travel" subtitle -->
  <text x="128" y="130" font-family="Arial, Helvetica, sans-serif" font-weight="300" font-size="22" fill="rgba(255,255,255,0.75)" letter-spacing="6">Tours &amp; Travel</text>
</svg>
